name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, app, admin]
    steps:
      # on workflow_run, github.sha is the default branch head, not the commit CI validated
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:cache,mode=max

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            webhook: COOLIFY_API_WEBHOOK
          - name: app
            webhook: COOLIFY_APP_WEBHOOK
          - name: admin
            webhook: COOLIFY_ADMIN_WEBHOOK
    steps:
      - name: Deploy ${{ matrix.name }}
        run: |
          curl --fail-with-body -X POST "${{ secrets[matrix.webhook] }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
